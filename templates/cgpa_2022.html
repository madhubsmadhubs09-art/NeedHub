
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>VTU 2022 CGPA Calculator - NeedHub</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="app">

    <header>
        <h1>VTU 2022 CGPA Calculator</h1>
        <p>Enter your semester SGPA and credits</p>
    </header>

    <div class="card">

        <h3>Semester Details</h3>

        <div class="subject-row">
            <input type="text" value="Semester 1" readonly>
            <input type="number" step="0.01" min="0" max="10"
                   placeholder="SGPA">
            <input type="number" min="1"
                   placeholder="Credits">
        </div>

        <div class="subject-row">
            <input type="text" value="Semester 2" readonly>
            <input type="number" step="0.01" min="0" max="10"
                   placeholder="SGPA">
            <input type="number" min="1"
                   placeholder="Credits">
        </div>

        <div class="subject-row">
            <input type="text" value="Semester 3" readonly>
            <input type="number" step="0.01" min="0" max="10"
                   placeholder="SGPA">
            <input type="number" min="1"
                   placeholder="Credits">
        </div>

        <div class="subject-row">
            <input type="text" value="Semester 4" readonly>
            <input type="number" step="0.01" min="0" max="10"
                   placeholder="SGPA">
            <input type="number" min="1"
                   placeholder="Credits">
        </div>

        <div class="subject-row">
            <input type="text" value="Semester 5" readonly>
            <input type="number" step="0.01" min="0" max="10"
                   placeholder="SGPA">
            <input type="number" min="1"
                   placeholder="Credits">
        </div>

        <div class="subject-row">
            <input type="text" value="Semester 6" readonly>
            <input type="number" step="0.01" min="0" max="10"
                   placeholder="SGPA">
            <input type="number" min="1"
                   placeholder="Credits">
        </div>

        <div class="subject-row">
            <input type="text" value="Semester 7" readonly>
            <input type="number" step="0.01" min="0" max="10"
                   placeholder="SGPA">
            <input type="number" min="1"
                   placeholder="Credits">
        </div>

        <div class="subject-row">
            <input type="text" value="Semester 8" readonly>
            <input type="number" step="0.01" min="0" max="10"
                   placeholder="SGPA">
            <input type="number" min="1"
                   placeholder="Credits">
        </div>


        <button onclick="calculateCGPA()">
            Calculate CGPA
        </button>


        <h2 id="result">
            CGPA: —
        </h2>

        <p id="percentage"></p>

    </div>

</div>


<script>

function calculateCGPA() {

    let rows =
        document.querySelectorAll(".subject-row");

    let totalCredits = 0;
    let totalPoints = 0;

    let validSemesters = 0;


    rows.forEach(function(row) {

        let inputs =
            row.querySelectorAll("input");

        let sgpa =
            parseFloat(inputs[1].value);

        let credits =
            parseFloat(inputs[2].value);


        if (isNaN(sgpa) || isNaN(credits)) {
            return;
        }


        if (sgpa < 0 || sgpa > 10) {
            return;
        }


        if (credits <= 0) {
            return;
        }


        totalCredits += credits;

        totalPoints += sgpa * credits;

        validSemesters++;

    });


    if (validSemesters === 0) {

        document.getElementById("result").innerText =
            "Please enter SGPA and credits.";

        document.getElementById("percentage").innerText = "";

        return;
    }


    let cgpa =
        totalPoints / totalCredits;


    cgpa =
        cgpa.toFixed(2);


    document.getElementById("result").innerText =
        "CGPA: " + cgpa;


    let percentage =
        parseFloat(cgpa) * 10;


    document.getElementById("percentage").innerText =
        "Percentage: " + percentage.toFixed(2) + "%";

}

</script>

</body>
</html>
